# ROLEX AI v2.2.0 — CI + Android APK build pipeline
name: ROLEX CI + APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system dependencies for document tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Run full pytest suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -q
      - name: Self-test verdict
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from rolex.security import run_self_test
          r = run_self_test()
          print("SELF-TEST:", r["verdict"], r["score"])
          assert r["verdict"] in ("HEALTHY", "DEGRADED")
          PY

  build:
    needs: test
    name: Build Android APK (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python 3.10 for Android toolchain
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install system dependencies (Buildozer + PDF + icon support)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf automake autopoint libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev gettext poppler-utils \
            librsvg2-bin
          java -version
          pdftotext -v
          rsvg-convert --version
          test -f /usr/share/aclocal/libtool.m4
          grep -R "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal /usr/share/libtool 2>/dev/null | head -n 5 || true

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools virtualenv
          pip install "buildozer==1.5.0" "cython==0.29.34"
          buildozer --version
          cython --version

      - name: Prepare Autobot launcher icon (offline)
        run: |
          set -e
          mkdir -p assets
          cat > assets/autobots.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="96" fill="#05070b"/>
            <g fill="none" stroke="#dce8ff" stroke-width="18" stroke-linejoin="round">
              <path fill="#101722" d="M256 58 126 112 92 300l62 102 102 52 102-52 62-102-34-188z"/>
              <path fill="#182332" d="M164 150 256 108l92 42-18 72-74 46-74-46z"/>
              <path fill="#dce8ff" d="m158 170 50 22-28 78-48-12zm196 0-50 22 28 78 48-12z"/>
              <path fill="#101722" d="m205 214 51 30 51-30-18 91-33 22-33-22z"/>
              <path fill="#dce8ff" d="m206 323 50 31 50-31-20 72-30 15-30-15z"/>
              <path d="M124 302h64m136 0h64M156 401l42-25m158 25-42-25"/>
            </g>
          </svg>
          SVG
          rsvg-convert -w 512 -h 512 assets/autobots.svg -o assets/icon.png
          file assets/icon.png
          test -s assets/icon.png

      - name: Verify project imports before building
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import rolex
          from rolex.assistant import get_assistant
          from rolex.ui import text_cockpit, COLORS, KIVY
          from rolex.security import run_self_test
          print("ROLEX import check OK · KIVY:", KIVY)
          report = run_self_test()
          print("SELF-TEST:", report["verdict"], report["score"])
          assert report["verdict"] in ("HEALTHY", "DEGRADED"), "self-test failed — refusing to build APK"
          PY

      - name: Remove stale Android build state
        run: |
          rm -rf .buildozer bin

      - name: Build APK with unmasked Buildozer exit status
        run: |
          buildozer -v android debug

      - name: Verify APK output
        run: |
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rolex-ai-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: (Tags only) Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
