# ROLEX AI v2.2.0 — CI + Android APK build pipeline
name: ROLEX CI + APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install system dependencies for document tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Run full pytest suite
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -q
      - name: Self-test verdict
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from rolex.security import run_self_test
          r = run_self_test()
          print("SELF-TEST:", r["verdict"], r["score"])
          assert r["verdict"] in ("HEALTHY", "DEGRADED")
          PY

  build:
    needs: test
    name: Build Android APK (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python 3.10 for Android toolchain
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install system dependencies (Buildozer + PDF support)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext poppler-utils
          java -version
          pdftotext -v

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools virtualenv
          pip install "buildozer==1.5.0" "cython==0.29.34"
          buildozer --version
          cython --version

      - name: Verify project imports before building
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import rolex
          from rolex.assistant import get_assistant
          from rolex.ui import text_cockpit, COLORS, KIVY
          from rolex.security import run_self_test
          print("ROLEX import check OK · KIVY:", KIVY)
          report = run_self_test()
          print("SELF-TEST:", report["verdict"], report["score"])
          assert report["verdict"] in ("HEALTHY", "DEGRADED"), "self-test failed — refusing to build APK"
          PY

      - name: Remove stale Android build state
        run: |
          rm -rf .buildozer bin

      - name: Build APK with unmasked Buildozer exit status
        run: |
          # Do NOT pipe through `yes`: it can hide the real Buildozer/p4a
          # failure behind `yes: Broken pipe`. SDK acceptance is configured
          # in buildozer.spec, so the build command must run directly.
          buildozer -v android debug

      - name: Verify APK output
        run: |
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rolex-ai-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: (Tags only) Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
