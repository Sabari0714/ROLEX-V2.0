[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rolex-ai"
version = "2.2.0"
description = "ROLEX — Personal Intelligence System (Tamil/English/Tanglish, local-first)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Rolex Project" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["rolex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
